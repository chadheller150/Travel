<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adriel's Birthday - Toronto & Montreal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="./style.css"/>
</head>
<body>
<!-- Loading Screen -->
<div id="loader">
  <div class="loader-content">
    <div class="leaf-fall">
      <span>🍁</span><span>🍂</span><span>🍁</span><span>🍂</span><span>🍁</span>
    </div>
    <h1 class="loader-title">Adriel's Birthday</h1>
    <p class="loader-sub">Toronto & Montreal</p>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>
</div>

<!-- Main App -->
<div id="app" style="display:none;">
  <!-- Hero -->
  <header class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="hero-eyebrow">October 20 - 24, 2026</p>
      <h1 class="hero-title">Adriel's Birthday</h1>
      <p class="hero-subtitle">Toronto <span class="dot">.</span> Montreal</p>
      <div class="hero-tags">
        <span class="tag">5 Friends</span>
        <span class="tag">2 Cities</span>
        <span class="tag">5 Days</span>
        <span class="tag">1 Concert</span>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <button class="nav-btn active" data-tab="overview">Overview</button>
      <button class="nav-btn" data-tab="day1">Tue 10/20</button>
      <button class="nav-btn" data-tab="day2">Wed 10/21</button>
      <button class="nav-btn" data-tab="day3">Thu 10/22</button>
      <button class="nav-btn" data-tab="day4">Fri 10/23</button>
      <button class="nav-btn" data-tab="day5">Sat 10/24</button>
      <button class="nav-btn" data-tab="map">Map</button>
      <button class="nav-btn" data-tab="dining">Dining</button>
      <button class="nav-btn" data-tab="nightlife">Nightlife</button>
      <button class="nav-btn" data-tab="logistics">Logistics</button>
      <button class="nav-btn" data-tab="confirmations">Confirmations</button>
      <button class="nav-btn" data-tab="budget">Budget</button>
    </div>
  </nav>

  <!-- Sections -->
  <main id="content"></main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./data.js"></script>
<script src="./app.js"></script>
<script src="./map.js"></script>
<script src="./sync.js"></script>
</body>
</html>
